name: Build BITree
description: Build and package one platform, then upload its release artifacts.

inputs:
  target:
    description: Flutter target platform
    required: true
  version:
    description: Display version, including the commit hash for dev builds
    required: true
  native-version:
    description: Numeric version accepted by Apple bundle metadata
    required: true
  build-number:
    description: Build number derived from the commit time
    required: true
  signing-password:
    description: Optional Android keystore password; builds use debug signing when empty
    required: false

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.15'
    - uses: actions/setup-java@v6
      if: ${{ inputs.target == 'android' }}
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle
    - name: Install Linux libraries
      if: ${{ inputs.target == 'linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
    - name: Configure Windows installer
      if: ${{ inputs.target == 'windows' }}
      shell: pwsh
      run: |
        "${env:ProgramFiles(x86)}\Inno Setup 6" >> $env:GITHUB_PATH
    - uses: subosito/flutter-action@v2
      if: ${{ runner.os != 'Linux' || runner.arch != 'ARM64' }}
      with:
        flutter-version: '3.47.7'
        channel: stable
        cache: true
        pub-cache: true
    # The release manifest has no Linux arm64 archive for this version, so check out the tag from git
    - uses: subosito/flutter-action@v2
      if: ${{ runner.os == 'Linux' && runner.arch == 'ARM64' }}
      with:
        flutter-version: '3.47.7'
        channel: master
        cache: true
        pub-cache: true
    - name: Select Android NDK
      id: ndk
      if: ${{ inputs.target == 'android' }}
      shell: python
      run: |
        import os
        import re
        from pathlib import Path

        extension = (
            Path(os.environ['FLUTTER_ROOT'])
            / 'packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt'
        )
        version = re.search(
            r'val ndkVersion: String = "([^"]+)"', extension.read_text()
        )[1]
        path = Path(os.environ['ANDROID_HOME']) / 'ndk' / version
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            output.write(f'version={version}\npath={path}\n')
    - name: Restore Android NDK
      id: ndk-cache
      if: ${{ inputs.target == 'android' }}
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.ndk.outputs.path }}
        key: ${{ runner.os }}-${{ runner.arch }}-ndk-${{ steps.ndk.outputs.version }}
    - name: Install Android NDK
      if: ${{ inputs.target == 'android' && steps.ndk-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: >-
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        "ndk;${{ steps.ndk.outputs.version }}"
    - name: Save Android NDK
      if: ${{ inputs.target == 'android' && steps.ndk-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.ndk.outputs.path }}
        key: ${{ steps.ndk-cache.outputs.cache-primary-key }}
    - run: flutter pub get --enforce-lockfile
      shell: bash
    - name: Analyze
      if: ${{ inputs.target == 'linux' }}
      run: flutter analyze --no-pub
      shell: bash
    - name: Test release packaging
      if: ${{ inputs.target == 'linux' && runner.arch == 'X64' }}
      run: python -m unittest discover -s tool -p 'test_*.py'
      shell: bash
    - name: Test update selection
      if: ${{ inputs.target == 'linux' }}
      run: flutter test --no-pub test/app_release_test.dart test/app_update_notes_test.dart
      shell: bash
    - name: Decrypt Android signing
      if: >-
        ${{ inputs.target == 'android' &&
            github.event_name != 'pull_request' &&
            inputs.signing-password != '' }}
      env:
        ANDROID_SIGNING_PASSWORD: ${{ inputs.signing-password }}
      shell: python
      run: |
        import os
        import subprocess
        from pathlib import Path

        password = os.environ['ANDROID_SIGNING_PASSWORD']
        os.umask(0o077)
        keystore = Path('android/signing/bitree-release.p12')
        subprocess.run(
            ['gpg', '--batch', '--yes', '--pinentry-mode', 'loopback',
             '--passphrase-fd', '0', '--output', str(keystore),
             '--decrypt', str(keystore) + '.gpg'],
            input=(password + '\n').encode('utf-8'),
            check=True,
        )

        properties = Path('android/key.properties')
        properties.write_text(
            'storeFile=signing/bitree-release.p12\n'
            f'storePassword={password}\n'
            'keyAlias=bitree-release\n'
            f'keyPassword={password}\n',
            encoding='utf-8',
        )
    - name: Build release artifacts
      env:
        BITREE_TARGET: ${{ inputs.target }}
        BITREE_VERSION: ${{ inputs.version }}
        BITREE_NATIVE_VERSION: ${{ inputs.native-version }}
        BITREE_BUILD_NUMBER: ${{ inputs.build-number }}
      shell: bash
      run: >-
        python tool/build_release.py "$BITREE_TARGET"
        --version "$BITREE_VERSION"
        --native-version "$BITREE_NATIVE_VERSION"
        --build-number "$BITREE_BUILD_NUMBER"
    - name: Upload debug symbols
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: debug-symbols-${{ inputs.target }}-${{ runner.arch }}-${{ inputs.version }}
        path: build/symbols/
        if-no-files-found: warn
        retention-days: 90
    - name: Upload Android arm64-v8a APK
      if: ${{ !cancelled() && inputs.target == 'android' }}
      uses: actions/upload-artifact@v7
      with:
        path: dist/*-android-arm64-v8a*.apk
        archive: false
        if-no-files-found: warn
        retention-days: 14
    - name: Upload Android app bundle
      if: ${{ !cancelled() && inputs.target == 'android' }}
      uses: actions/upload-artifact@v7
      with:
        path: dist/*.aab
        archive: false
        if-no-files-found: warn
        retention-days: 14
    - name: Upload desktop or iOS package
      if: ${{ !cancelled() && inputs.target != 'android' }}
      uses: actions/upload-artifact@v7
      with:
        path: |
          dist/*.exe
          dist/*.tar.xz
          dist/*.zip
          dist/*.ipa
        archive: false
        if-no-files-found: warn
        retention-days: 14
    - name: Upload update metadata
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        path: dist/*-update.json
        archive: false
        if-no-files-found: warn
        retention-days: 14
    - name: Remove Android signing files
      if: ${{ always() && inputs.target == 'android' }}
      shell: python
      run: |
        from pathlib import Path
        Path('android/key.properties').unlink(missing_ok=True)
        Path('android/signing/bitree-release.p12').unlink(missing_ok=True)
